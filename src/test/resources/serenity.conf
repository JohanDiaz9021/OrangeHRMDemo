serenity.project.name = PetStay
serenity.test.root = features
serenity.requirements.dir = features
serenity.requirements.base.dir = src/test/resources
serenity.outputDirectory = target/site/serenity
serenity.report.encoding = UTF8
# FOR_EACH_ACTION solo para depurar: vuelve lenta la suite
serenity.take.screenshots = FOR_FAILURES

serenity.browser = chrome

# Serenity 5 arma las opciones de Chrome con chrome.switches (ignora la lista "args" de goog:chromeOptions).
# --headless=new es obligatorio en GitHub Actions: el servidor no tiene pantalla.
# Para ver el navegador en tu PC, quita --headless=new de esta lista.
chrome.switches = "--headless=new;--no-sandbox;--disable-dev-shm-usage;--window-size=1920,1080;--remote-allow-origins=*;--lang=es"

webdriver {
  base.url = "https://petstay-aphn.onrender.com"
  # Render apaga la app cuando nadie la usa: la primera carga puede tardar casi un minuto
  timeouts.pageLoadTimeout = 120000
  # Tiempo maximo que un Target espera a que su elemento este listo
  wait.for.timeout = 10000
}

# Elegir navegador con -Denvironment=chrome | edge | firefox (sin indicarlo se usa default = chrome)
environments {
  default {
    webdriver {
      driver = "chrome"
      autodownload = true
      capabilities {
        browserName = "chrome"
        acceptInsecureCerts = true
        "goog:chromeOptions" {
          args = ["--headless=new", "--window-size=1920,1080", "--no-sandbox", "--disable-dev-shm-usage",
                  "--disable-popup-blocking", "--disable-infobars", "--disable-notifications",
                  "--remote-allow-origins=*", "--ignore-certificate-errors", "--lang=es"]
        }
      }
    }
  }
  chrome {
    webdriver {
      driver = "chrome"
      autodownload = true
      capabilities {
        browserName = "chrome"
        acceptInsecureCerts = true
        "goog:chromeOptions" {
          args = ["--headless=new", "--window-size=1920,1080", "--no-sandbox", "--disable-dev-shm-usage",
                  "--disable-popup-blocking", "--disable-infobars", "--disable-notifications",
                  "--remote-allow-origins=*", "--ignore-certificate-errors", "--lang=es"]
        }
      }
    }
  }
  edge {
    webdriver {
      driver = "edge"
      autodownload = true
      capabilities {
        browserName = "MicrosoftEdge"
        "ms:edgeOptions" {
          args = ["test-type", "ignore-certificate-errors", "headless", "window-size=1920,1080",
                  "incognito", "disable-infobars", "disable-gpu", "disable-default-apps", "disable-popup-blocking"]
        }
      }
    }
  }
  firefox {
    webdriver {
      driver = "firefox"
      autodownload = true
      capabilities {
        browserName = "firefox"
        pageLoadStrategy = "normal"
        acceptInsecureCerts = true
        unhandledPromptBehavior = "dismiss"
        strictFileInteractability = true

        "moz:firefoxOptions" {
          args = ["-headless", "--width=1920", "--height=1080"]
          prefs {
            "javascript.options.showInConsole": false
          },
          log {"level": "info"}
        }
      }
    }
  }
}
