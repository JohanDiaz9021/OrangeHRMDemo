plugins {
    id 'java'
    id 'net.serenity-bdd.serenity-gradle-plugin' version '5.3.9'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
}

ext {
    serenityVersion = '5.3.11'
    seleniumVersion = '4.50.0'
}

dependencies {
    // Serenity BDD + Screenplay (todas con la misma version)
    testImplementation "net.serenity-bdd:serenity-core:${serenityVersion}"
    testImplementation "net.serenity-bdd:serenity-cucumber:${serenityVersion}"
    testImplementation "net.serenity-bdd:serenity-screenplay:${serenityVersion}"
    testImplementation "net.serenity-bdd:serenity-screenplay-webdriver:${serenityVersion}"
    testImplementation "net.serenity-bdd:serenity-ensure:${serenityVersion}"

    // Runner de Cucumber sobre JUnit 5
    testImplementation 'org.junit.platform:junit-platform-suite:1.14.0'
    testImplementation 'io.cucumber:cucumber-junit-platform-engine:7.34.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // WebDriver (una sola version de Selenium para todo el proyecto)
    testImplementation "org.seleniumhq.selenium:selenium-java:${seleniumVersion}"

    // Logs (quita el aviso "No SLF4J providers were found")
    testRuntimeOnly 'org.slf4j:slf4j-simple:2.0.20'
}

configurations.all {
    resolutionStrategy.eachDependency { details ->
        // htmlunit3-driver tiene su propia numeracion de versiones
        if (details.requested.group == 'org.seleniumhq.selenium' && details.requested.name != 'htmlunit3-driver') {
            details.useVersion seleniumVersion
        }
    }
}

// Tildes y ñ en el codigo y en los .feature (Windows no usa UTF-8 por defecto)
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform()
    // Propaga -Denvironment, -Dcucumber.filter.tags, etc.
    systemProperties System.getProperties()
    systemProperty 'file.encoding', 'UTF-8'
    // aggregate se ejecuta aunque fallen escenarios, así que el reporte siempre se genera
    finalizedBy 'aggregate'
}
